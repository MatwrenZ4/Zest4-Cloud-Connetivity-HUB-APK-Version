<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Offline | Zest4 Cloud &amp; Connectivity Hub</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    padding-top: calc(32px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
    background: #FBFAF7;
    color: #172033;
    font-family: 'Inter', system-ui, sans-serif;
    text-align: center;
  }
  .box { max-width: 380px; }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    margin: 16px 0 8px;
    color: #055491;
  }
  p { font-size: 15px; color: #5B6472; line-height: 1.55; margin: 0 0 24px; }
  svg { color: #055491; }
  button {
    -webkit-tap-highlight-color: transparent;
    background: #055491;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font: 600 15px/1 'Inter', sans-serif;
    cursor: pointer;
  }
  button:active { background: #033B66; }
  a.home-link {
    display: block;
    margin-top: 16px;
    color: #055491;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="box">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M2 9.5a15 15 0 0 1 20 0" opacity="0.35"/><path d="M3 3l18 18"/></svg>
    <h1>You're offline</h1>
    <p>This page hasn't been saved for offline use, and there's no connection right now. Tools and downloaded documents you've opened before should still work.</p>
    <button onclick="location.reload()">Try again</button>
    <a class="home-link" href="index.html">&larr; Back to Hub</a>
  </div>
</body>
</html>
