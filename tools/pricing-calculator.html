<!DOCTYPE html>
<html lang="en">

<style>
  :root{
    --z-blue: #1421e0;
    --z-blue-deep: #0d167f;
    --z-yellow: #ffd400;
    --ink: #15182c;
    --ink-soft: #565a72;
    --line: #e3e4ee;
    --bg: #f5f6fb;
    --card: #ffffff;
    --good: #0f9d58;
    --radius: 10px;
    font-size: 16px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .app{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .brand-logo{
    height: 34px;
    width: auto;
    display: block;
  }
  .brand-sub{
    font-size: 12.5px;
    color: var(--ink-soft);
    border-left: 1px solid var(--line);
    padding-left: 12px;
  }
  .mode-pill{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px 6px 6px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .mode-pill strong{
    color: var(--z-blue);
    font-weight: 700;
  }
  .mode-pill .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--good);
    flex: none;
  }
  .mode-pill button{
    border: none;
    background: transparent;
    color: var(--z-blue);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .mode-pill button:hover{ background: #eef0ff; }

  /* ---------- Reseller Quote Builder wrapper ---------- */
  .reseller-app-bar{
    display:flex;
    justify-content: flex-start;
    margin-bottom: 12px;
  }
  .reseller-app-bar .pill-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .reseller-app-bar .pill-btn:hover{ border-color: var(--z-blue); background: #f4f5ff; color: var(--z-blue); }

  /* ---------- Gate screen ---------- */
  .gate{
    min-height: 70vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .gate-card{
    max-width: 620px;
  }
  .gate-eyebrow{
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--z-blue);
    margin-bottom: 10px;
  }
  .gate h1{
    font-size: clamp(28px, 4vw, 38px);
    line-height: 1.15;
    margin: 0 0 14px;
    letter-spacing: -0.5px;
  }
  .gate p.lead{
    color: var(--ink-soft);
    font-size: 16px;
    margin: 0 0 36px;
    line-height: 1.5;
  }
  .gate-options{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 600px){
    .gate-options{ grid-template-columns: 1fr; }
  }
  .gate-btn{
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 28px 22px;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    font-family: inherit;
  }
  .gate-btn:hover{
    border-color: var(--z-blue);
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(20,33,224,0.12);
  }
  .gate-btn .icon{
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--z-blue);
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 16px;
    color: white;
    font-weight: 800;
    font-size: 16px;
  }
  .gate-btn.alt .icon{ background: var(--z-blue-deep); }
  .gate-btn h3{
    margin: 0 0 6px;
    font-size: 18px;
  }
  .gate-btn p{
    margin: 0;
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.45;
  }

  /* ---------- Main layout ---------- */
  .layout{
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 880px){
    .layout{ grid-template-columns: 1fr; }
  }

  .panel{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
  }
  .panel h2{
    font-size: 15px;
    margin: 0 0 16px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--ink-soft);
  }

  /* ---------- Product selector ---------- */
  .selector-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  @media (max-width: 520px){
    .selector-row{ grid-template-columns: 1fr; }
  }
  label.field-label{
    display:block;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  select, input[type="number"], input[type="text"]{
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    font-size: 14.5px;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
  }
  select:focus, input:focus{
    outline: none;
    border-color: var(--z-blue);
  }
  .qty-row{
    display:flex;
    gap: 10px;
    align-items: end;
  }
  .qty-row .qty-field{ width: 110px; flex: none; }
  .add-btn{
    background: var(--z-blue);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    flex: 1;
    transition: background .15s ease;
  }
  .add-btn:hover{ background: var(--z-blue-deep); }
  .add-btn:disabled{
    background: #c4c8e6;
    cursor: not-allowed;
  }

  .item-preview{
    background: #f8f9ff;
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-bottom: 14px;
    min-height: 20px;
  }
  .item-preview strong{ color: var(--ink); }
  .item-preview .price-tag{
    color: var(--z-blue);
    font-weight: 700;
  }

  .notes-line{
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: -6px;
    margin-bottom: 14px;
  }

  /* Quick search */
  .search-wrap{ margin-bottom: 14px; }

  /* ---------- Quote list ---------- */
  .quote-empty{
    text-align:center;
    padding: 36px 12px;
    color: var(--ink-soft);
    font-size: 13.5px;
  }
  .quote-item{
    display:grid;
    grid-template-columns: 1fr auto auto auto;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .quote-item:last-child{ border-bottom: none; }
  .qi-name{
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.3;
  }
  .qi-name .qi-group{
    display:block;
    font-weight: 500;
    color: var(--ink-soft);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 2px;
  }
  .qi-qty{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .qi-qty button{
    width: 24px; height: 24px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    color: var(--ink-soft);
  }
  .qi-qty button:hover{ background: #f1f2f9; }
  .qi-qty input{
    width: 42px;
    text-align: center;
    padding: 4px 2px;
    font-size: 13px;
  }
  .qi-price{
    font-size: 13.5px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .qi-total{
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    min-width: 70px;
    text-align: right;
  }
  .qi-remove{
    background: none;
    border: none;
    color: #c0392b;
    cursor: pointer;
    font-size: 13px;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .qi-remove:hover{ background: #fbeaea; }

  .qi-setup-note{
    font-size: 11px;
    color: var(--ink-soft);
    grid-column: 1 / -1;
    margin-top: -4px;
  }

    margin-top: 16px;
    padding-top: 16px;
    border-top: 2px solid var(--ink);
  }
  .totals-row{
    display:flex;
    justify-content: space-between;
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .totals-row.grand{
    font-size: 19px;
    font-weight: 800;
    color: var(--ink);
    margin-top: 4px;
  }
  .totals-row.grand .val{ color: var(--z-blue); }

  .clear-btn{
    width: 100%;
    margin-top: 16px;
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .clear-btn:hover{
    border-color: #c0392b;
    color: #c0392b;
  }

  .footer-note{
    margin-top: 18px;
    font-size: 11.5px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  /* ---------- Call-routing gate (8x8 ring group check) ---------- */
  .call-gate-container{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f8f9fa;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .call-gate-box{
    text-align: center;
    padding: 30px;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    max-width: 400px;
  }
  .call-gate-hidden{
    display: none !important;
  }
  .call-gate-loader{
    border: 4px solid #f3f3f3;
    border-top: 4px solid #3498db;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: call-gate-spin 1s linear infinite;
    margin: 0 auto 20px auto;
  }
  @keyframes call-gate-spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>

  function setMode(m){
    mode = m;
    quoteItems = [];
    render();
  }

  function switchMode(){
    if(mode !== 'reseller-app' && quoteItems.length > 0){
      const ok = confirm('Switching pricing book will clear your current quote. Continue?');
      if(!ok) return;
    }
    mode = null;
    quoteItems = [];
    render();
  }

  // ---------- Reseller Quote Builder (embedded standalone app) ----------
  function b64ToUtf8(b64){
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function renderResellerApp(){
    root.innerHTML = `
      <div class="reseller-app-bar">
        <button class="pill-btn ghost" id="reseller-back-btn">&larr; Switch pricing book</button>
      </div>
      <iframe id="reseller-frame" title="Reseller Quote Builder"
        style="width:100%;border:0;display:block;min-height:900px;"></iframe>
    `;
    document.getElementById('reseller-back-btn').addEventListener('click', switchMode);

    const iframe = document.getElementById('reseller-frame');
    iframe.srcdoc = b64ToUtf8(RESELLER_APP_B64);

    // Keep the iframe tall enough for its content since it has no scroll of
    // its own inside the calculator's page chrome.
    iframe.addEventListener('load', () => {
      try {
        const resize = () => {
          const doc = iframe.contentDocument;
          if(!doc) return;
          const h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
          iframe.style.height = (h + 40) + 'px';
        };
        resize();
        // Content height can change as the reseller app re-renders (adding
        // products, opening the settings modal, etc.), so keep checking.
        new (iframe.contentWindow.ResizeObserver || function(){ return { observe(){} }; })(resize)
          .observe(iframe.contentDocument.body);
        setInterval(resize, 500);
      } catch(e){ /* cross-origin safety net; srcdoc is same-origin so this shouldn't fire */ }
    });
  }

  // ---------- Selector logic ----------
  function setupSelectors(data){
    const groupSelect = document.getElementById('group-select');
    const categorySelect = document.getElementById('category-select');
    const itemSelect = document.getElementById('item-select');
    const searchInput = document.getElementById('search-input');
    const qtyInput = document.getElementById('qty-input');
    const addBtn = document.getElementById('add-btn');
    const preview = document.getElementById('item-preview');
    const notesLine = document.getElementById('category-notes');

    // Build group list (unique, ordered by first appearance)
    const groups = [];
    data.categories.forEach(c => { if(!groups.includes(c.group)) groups.push(c.group); });

    groupSelect.innerHTML = groups.map(g => `<option value="${g}">${g}</option>`).join('');

    function populateCategories(){
      const g = groupSelect.value;
      const cats = data.categories.filter(c => c.group === g);
      categorySelect.innerHTML = cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      populateItems();
    }

    function populateItems(){
      const catId = categorySelect.value;
      const cat = data.categories.find(c => c.id === catId);
      if(!cat){ itemSelect.innerHTML=''; return; }
      itemSelect.innerHTML = cat.items.map((it, idx) =>
        `<option value="${idx}">${it.name} — ${it.price === 0 ? 'FOC' : fmtGBP(it.price) + ' / ' + it.unit}</option>`
      ).join('');
      notesLine.textContent = cat.notes ? cat.notes : '';
      updatePreview();
    }

    function currentItem(){
      const catId = categorySelect.value;
      const cat = data.categories.find(c => c.id === catId);
      if(!cat) return null;
      const idx = parseInt(itemSelect.value, 10);
      return { cat, item: cat.items[idx] };
    }

    const SETUP_FEE_CATS = ['8x8-xseries', 'csw-licences', '8x8-engage'];

    function showSetupFeeToggle(catId){
      const row = document.getElementById('setup-fee-row');
      if(!row) return;
      if(SETUP_FEE_CATS.includes(catId)){
        row.style.display = 'block';
      } else {
        row.style.display = 'none';
        const cb = document.getElementById('setup-fee-checkbox');
        if(cb) cb.checked = false;
      }
    }

    function updatePreview(){
      const sel = currentItem();
      if(!sel || !sel.item){
        preview.innerHTML = 'Select a product to see pricing details.';
        showSetupFeeToggle('');
        return;
      }
      const { cat, item } = sel;
      let html = `<strong>${item.name}</strong> &mdash; <span class="price-tag">${item.price === 0 ? 'FOC' : fmtGBP(item.price) + ' per ' + item.unit}</span>`;
      if(item.setup){
        html += `<br>Plus one-off setup fee: <strong>${fmtGBP(item.setup)}</strong>`;
      }
      if(item.note){
        html += `<br><em>${item.note}</em>`;
      }
      html += `<br><span style="color:#9094ab;">${cat.group} &rsaquo; ${cat.name}</span>`;
      preview.innerHTML = html;
      showSetupFeeToggle(cat.id);
    }

    groupSelect.addEventListener('change', populateCategories);
    categorySelect.addEventListener('change', populateItems);
    itemSelect.addEventListener('change', updatePreview);

    // Search across all items
    let searchResults = []; // flat list when searching
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      if(q.length < 2){
        searchResults = [];
        groupSelect.disabled = false;
        categorySelect.disabled = false;
        groupSelect.style.display = '';
        categorySelect.style.display = '';
        populateCategories();
        return;
      }
      const flat = [];
      data.categories.forEach(cat => {
        cat.items.forEach((item, idx) => {
          if(item.name.toLowerCase().includes(q) || cat.name.toLowerCase().includes(q) || cat.group.toLowerCase().includes(q)){
            flat.push({ cat, item, idx });
          }
        });
      });
      searchResults = flat;
      groupSelect.style.display = 'none';
      categorySelect.style.display = 'none';
      if(flat.length === 0){
        itemSelect.innerHTML = `<option value="">No matches found</option>`;
        preview.innerHTML = 'No matching products. Try a different search term.';
        notesLine.textContent = '';
        return;
      }
      itemSelect.innerHTML = flat.map((f, i) =>
        `<option value="${i}">${f.cat.group} — ${f.item.name} — ${f.item.price === 0 ? 'FOC' : fmtGBP(f.item.price) + ' / ' + f.item.unit}</option>`
      ).join('');
      itemSelect.dataset.searchMode = 'true';
      updatePreviewFromSearch();
    });

    function updatePreviewFromSearch(){
      const i = parseInt(itemSelect.value, 10);
      const f = searchResults[i];
      if(!f){ return; }
      const { cat, item } = f;
      let html = `<strong>${item.name}</strong> &mdash; <span class="price-tag">${item.price === 0 ? 'FOC' : fmtGBP(item.price) + ' per ' + item.unit}</span>`;
      if(item.setup){
        html += `<br>Plus one-off setup fee: <strong>${fmtGBP(item.setup)}</strong>`;
      }
      if(item.note){
        html += `<br><em>${item.note}</em>`;
      }
      html += `<br><span style="color:#9094ab;">${cat.group} &rsaquo; ${cat.name}</span>`;
      preview.innerHTML = html;
      notesLine.textContent = cat.notes ? cat.notes : '';
      showSetupFeeToggle(cat.id);
    }

    itemSelect.addEventListener('change', () => {
      if(itemSelect.dataset.searchMode === 'true' && searchInput.value.trim().length >= 2){
        updatePreviewFromSearch();
      }
    });

    addBtn.addEventListener('click', () => {
      const qty = Math.max(1, parseInt(qtyInput.value, 10) || 1);
      const includeSetup = document.getElementById('setup-fee-checkbox')?.checked || false;
      let cat, item;
      if(itemSelect.dataset.searchMode === 'true' && searchInput.value.trim().length >= 2){
        const i = parseInt(itemSelect.value, 10);
        const f = searchResults[i];
        if(!f) return;
        cat = f.cat; item = f.item;
      } else {
        const sel = currentItem();
        if(!sel || !sel.item) return;
        cat = sel.cat; item = sel.item;
      }
      addToQuote(cat, item, qty, includeSetup);
      qtyInput.value = 1;
      // Reset checkbox after adding
      const cb = document.getElementById('setup-fee-checkbox');
      if(cb) cb.checked = false;
    });

    // init
    populateCategories();
  }

  // ---------- Router prompt ----------
  const ROUTER = {
    key: 'addon::Zyxel DX-3301 Router',
    group: 'Connectivity',
    category: 'Router',
    name: 'Zyxel DX-3301 Router',
    price: 74.95,
    unit: 'unit',
    setup: 0,
    qty: 1
  };

  const BROADBAND_KEYWORDS = ['sogea','fttp','soGEA','FTTP'];

  function isBroadband(item){ return BROADBAND_KEYWORDS.some(k => item.name.toLowerCase().includes(k.toLowerCase())); }
  function hasRouter(){ return quoteItems.some(q => q.key === ROUTER.key); }
  function hasBroadband(){ return quoteItems.some(q => isBroadband(q)); }

  function promptRouter(){
    // Only prompt once — if router already in quote, skip
    if(hasRouter()) return;
    const banner = document.getElementById('router-prompt');
    if(banner) banner.style.display = 'flex';
  }

  function dismissRouter(){
    const banner = document.getElementById('router-prompt');
    if(banner) banner.style.display = 'none';
  }

  function addRouter(){
    if(!hasRouter()){
      quoteItems.push({...ROUTER});
    }
    dismissRouter();
    renderQuote();
  }

  // ---------- Product descriptions for export ----------
  const DESCRIPTIONS = {
    // 8x8
    'Lobby': 'Internal-only calling licence for users who only need on-site extension dialling. Includes Auto Attendant and HD Voice.',
    'X1': 'Entry-level hosted UC licence with unlimited UK landline and mobile calling, voicemail, call recording, and mobile/desktop apps.',
    'X2': 'UC licence with unlimited calling across 14 countries, CRM integrations, internet fax, and conferencing for up to 100 participants.',
    'X3': 'UC licence with unlimited calling across 32 countries, Operator Switchboard, and 130-day hot storage for call recordings.',
    'X4': 'Advanced UC licence with 47-country calling, Premium Analytics, Call Quality Reporting, and Barge/Monitor/Whisper.',
    'X6': 'Contact Centre licence with IVR, Skills-Based Routing, Graphical Call Flows, Queued & Web Callback, and Native CRM.',
    'X7': 'Full Contact Centre licence with inbound Chat, Email and Social Channels, Co-Browse, and optional Quality Management.',
    'X8': 'Top-tier Contact Centre licence including Quality Management & Speech Analytics, Co-Browse, and all omnichannel features.',
    '8x8 Engage': 'Lightweight contact centre add-on for teams handling customer calls within the familiar 8x8 Work app, without a full CC licence.',
    // CallSwitch
    'CallSwitch Business': 'Hosted VoIP licence including 2,000 minutes to UK landlines and mobiles, mobile/desktop apps, CRM integration, 90-day call recording, and SMS.',
    'CallSwitch One Hardware': 'IP desk phone or DECT handset compatible with the CallSwitch One platform.',
    // Horizon
    'Premium Licence': 'Horizon hosted PBX licence with unlimited calls to UK 01, 02, 03 and 07 numbers (500 mobile minutes fair use per seat).',
    // Connectivity
    'SoGEA': 'Single Order Generic Ethernet Access — full-fibre broadband delivered without a phone line, suitable for VoIP-only sites.',
    'FTTP': 'Fibre to the Premises — ultrafast symmetrical broadband with speeds from 80Mbps up to 1Gbps, ideal for high-demand VoIP sites.',
    'SIP': 'Session Initiation Protocol trunk connecting an existing PBX to the PSTN over an IP connection.',
    'Zyxel DX-3301 Router': 'The Zyxel DX-3301-T0 is a dual-band Wi-Fi 6 router providing high-speed internet access with QoS support. It features 2x2 802.11ax WLAN with speeds up to 1,200 Mbps on 5 GHz, and supports Zyxel MPro Mesh for seamless whole-premises WiFi coverage. Recommended for use with SoGEA and FTTP broadband connections.',
    // Hardware
    '8x8 Hardware': 'IP desk phone, DECT handset, or accessory certified for use with the 8x8 platform.',
    // Engineering
    'Site Survey': 'On-site pre-installation survey to assess network readiness, cabling, and equipment placement for up to 50 extensions.',
    'Install': 'On-site installation and configuration of hardware and telephony system by a Zest4 engineer.',
    'Training': 'End-user or admin training session delivered on-site or via webinar.',
    // Akixi
    'Akixi': 'Cloud-based call management and reporting platform providing real-time wallboards, historical reporting, and call analytics.',
    // PCI
    'DTMF Capture': 'PCI-compliant DTMF tone suppression — pauses call recording during card payment to prevent cardholder data capture.',
    'Digital Payment Link': 'Sends a secure payment link to the customer mid-call, allowing card payments without agents handling card data.',
    // Atmos / Compliance
    'Atmos Core Recording Licence': 'Compliance call recording with search, retrieval, and playback. Includes unlimited cloud storage for up to 7 years.',
    'Atmos Advanced Recording Licence': 'Advanced compliance recording with screen capture, speech-to-text transcription, PCI redaction, and call sharing.',
    'Setup Fee': 'One-off Zest4 configuration fee. Zest4 will handle full system setup on your behalf. We will contact you to collect all configuration requirements including call routing, ring groups, auto attendant settings, user details, and any other preferences.',
  };

  function getDescription(item){
    // Try exact name match first, then partial keyword match
    for(const [key, desc] of Object.entries(DESCRIPTIONS)){
      if(item.name.includes(key) || item.category.includes(key) || item.group.includes(key)){
        return desc;
      }
    }
    return '';
  }

  // ---------- Quote manipulation ----------
  function addToQuote(cat, item, qty, includeSetup){
    const key = cat.id + '::' + item.name;
    const setupFee = includeSetup ? 15.00 : (item.setup || 0);
    const existing = quoteItems.find(q => q.key === key);
    if(existing){
      existing.qty += qty;
      // If they're adding more with setup fee ticked, keep setup fee if it was already set
      if(includeSetup && !existing.setup) existing.setup = 15.00;
    } else {
      quoteItems.push({
        key,
        group: cat.group,
        category: cat.name,
        name: item.name,
        price: item.price,
        unit: item.unit,
        setup: setupFee,
        qty,
        hasSetupFee: includeSetup || false,
      });
    }
    // If a broadband product was just added, prompt to add the router
    if(isBroadband(item)) promptRouter();
    renderQuote();
  }

  function removeFromQuote(key){
    quoteItems = quoteItems.filter(q => q.key !== key);
    // Hide router prompt if no broadband left in quote
    if(!hasBroadband()) dismissRouter();
    renderQuote();
  }

  function changeQty(key, delta){
    const q = quoteItems.find(q => q.key === key);
    if(!q) return;
    q.qty = Math.max(1, q.qty + delta);
    renderQuote();
  }

  function setQty(key, val){
    const q = quoteItems.find(q => q.key === key);
    if(!q) return;
    q.qty = Math.max(1, parseInt(val, 10) || 1);
    renderQuote();
  }

  // ---------- Render quote ----------
  function renderQuote(){
    const list = document.getElementById('quote-list');
    if(!list) return;

    // Router prompt banner (persists above list)
    const routerBannerExists = document.getElementById('router-prompt');
    if(!routerBannerExists){
      const banner = document.createElement('div');
      banner.id = 'router-prompt';
      banner.style.cssText = 'display:none;align-items:center;gap:12px;background:#fffbea;border:1.5px solid #f0c000;border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:13.5px;flex-wrap:wrap;';
      banner.innerHTML = `
        <span style="flex:1;min-width:180px;">📦 <strong>Router needed?</strong> A Zyxel DX-3301 is recommended for SoGEA / FTTP connections — <strong>£74.95</strong></span>
        <button id="router-add-btn" style="background:#1421e0;color:#fff;border:none;border-radius:7px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;">Add Router</button>
        <button id="router-dismiss-btn" style="background:transparent;border:1px solid #ccc;border-radius:7px;padding:8px 10px;font-size:12px;cursor:pointer;color:#666;">No thanks</button>
      `;
      list.parentNode.insertBefore(banner, list);
      // Listeners wired after insert (IDs exist in DOM now)
      document.getElementById('router-add-btn').addEventListener('click', addRouter);
      document.getElementById('router-dismiss-btn').addEventListener('click', dismissRouter);
    }

    if(quoteItems.length === 0){
      list.innerHTML = `<div class="quote-empty">No products added yet.<br>Use the panel on the left to build a quote.</div>`;
    } else {
      list.innerHTML = quoteItems.map(q => {
        const lineTotal = q.price * q.qty;
        return `
          <div class="quote-item">
            <div class="qi-name">
              <span class="qi-group">${q.group} &rsaquo; ${q.category}</span>
              ${q.name}
            </div>
            <div class="qi-qty">
              <button data-action="dec" data-key="${escapeAttr(q.key)}">&minus;</button>
              <input type="number" min="1" value="${q.qty}" data-action="set" data-key="${escapeAttr(q.key)}">
              <button data-action="inc" data-key="${escapeAttr(q.key)}">&plus;</button>
            </div>
            <div class="qi-price">${q.price === 0 ? 'FOC' : fmtGBP(q.price) + '/' + q.unit}</div>
            <div class="qi-total">${fmtGBP(lineTotal)}</div>
            <button class="qi-remove" data-action="remove" data-key="${escapeAttr(q.key)}">Remove</button>
            ${q.hasSetupFee ? `<div class="qi-setup-note">
              ⚙ Zest4 setup fee: £15.00 × ${q.qty} = <strong>${fmtGBP(15 * q.qty)}</strong> (one-off) &mdash; <em>configuration details required</em>
            </div>` : ''}
          </div>
        `;
      }).join('');

      list.querySelectorAll('[data-action="dec"]').forEach(b => b.addEventListener('click', () => changeQty(b.dataset.key, -1)));
      list.querySelectorAll('[data-action="inc"]').forEach(b => b.addEventListener('click', () => changeQty(b.dataset.key, 1)));
      list.querySelectorAll('[data-action="remove"]').forEach(b => b.addEventListener('click', () => removeFromQuote(b.dataset.key)));
      list.querySelectorAll('input[data-action="set"]').forEach(inp => inp.addEventListener('change', () => setQty(inp.dataset.key, inp.value)));
    }

    // ---------- Totals ----------
    const hardwareKeys = ['unit','one-off','hour','CLI','billing number','order/day','number','order','request','day','connection'];
    const recurringItems = quoteItems.filter(q => !hardwareKeys.includes(q.unit));
    const onetimeItems   = quoteItems.filter(q =>  hardwareKeys.includes(q.unit));

    const recurringTotal = recurringItems.reduce((s,q) => s + q.price * q.qty, 0);
    const hardwareTotal  = onetimeItems.reduce((s,q) => s + q.price * q.qty, 0);

    // Setup fees: £15 per licence for items where the checkbox was ticked
    const setupFeeTotal  = quoteItems
      .filter(q => q.hasSetupFee)
      .reduce((s,q) => s + 15 * q.qty, 0);

    const onetimeTotal = hardwareTotal + setupFeeTotal;
    const grandTotal   = recurringTotal + onetimeTotal;

    const elR = document.getElementById('total-recurring');
    const elO = document.getElementById('total-onetime');
    const elG = document.getElementById('total-grand');
    const elS = document.getElementById('total-setup');
    if(elR) elR.textContent = fmtGBP(recurringTotal);
    if(elO) elO.textContent = fmtGBP(hardwareTotal);
    if(elS){
      elS.textContent = fmtGBP(setupFeeTotal);
      document.getElementById('total-setup-row').style.display = setupFeeTotal > 0 ? 'flex' : 'none';
    }
    if(elG) elG.textContent = fmtGBP(grandTotal);

    // Show/hide export button
    const exportBtn = document.getElementById('export-btn');
    if(exportBtn) exportBtn.style.display = quoteItems.length > 0 ? 'block' : 'none';
  }

  // ---------- Export as PDF ----------
  function exportQuote(){
    const data = PRICING_DATA[mode];
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-GB', { day:'2-digit', month:'long', year:'numeric' });
    const fileName = `Zest4-Quote-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.pdf`;

    const hardwareKeys = ['unit','one-off','hour','CLI','billing number','order/day','number','order','request','day','connection'];
    const recurringItems = quoteItems.filter(q => !hardwareKeys.includes(q.unit));
    const onetimeItems   = quoteItems.filter(q =>  hardwareKeys.includes(q.unit));
    const setupFeeItems  = quoteItems.filter(q => q.hasSetupFee);

    const recurringTotal = recurringItems.reduce((s,q) => s + q.price * q.qty, 0);
    const hardwareTotal  = onetimeItems.reduce((s,q) => s + q.price * q.qty, 0);
    const setupFeeTotal  = setupFeeItems.reduce((s,q) => s + 15 * q.qty, 0);
    const onetimeTotal   = hardwareTotal + setupFeeTotal;
    const grandTotal     = recurringTotal + onetimeTotal;

    // Colours
    const BLUE      = [20, 33, 224];
    const BLUE_LIGHT= [230, 233, 252];
    const AMBER     = [180, 83, 9];
    const AMBER_LITE= [255, 248, 230];
    const GREY_HDR  = [245, 245, 245];
    const GREY_TEXT = [100, 100, 110];
    const INK       = [21, 24, 44];
    const WHITE     = [255, 255, 255];

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const PW = 210; // page width mm
    const ML = 14;  // margin left
    const MR = 14;  // margin right
    const CW = PW - ML - MR; // content width

    // ---- Header bar ----
    doc.setFillColor(...BLUE);
    doc.rect(0, 0, PW, 28, 'F');

    doc.setTextColor(...WHITE);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(18);
    doc.text('Zest4', ML, 12);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.text('Cloud & Connectivity', ML, 18);
    doc.text('Quote', ML, 23);

    // Right-aligned date + pricing book
    doc.setFontSize(8);
    doc.text(`Prepared: ${dateStr}`, PW - MR, 13, { align: 'right' });
    doc.text(data.label + ' pricing', PW - MR, 18, { align: 'right' });
    doc.text('All prices exc. VAT', PW - MR, 23, { align: 'right' });

    let y = 36;

    // ---- Helper: section label ----
    function sectionLabel(label, bgColor, textColor){
      doc.setFillColor(...bgColor);
      doc.rect(ML, y, CW, 7, 'F');
      doc.setTextColor(...textColor);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7.5);
      doc.text(label.toUpperCase(), ML + 3, y + 4.8);
      y += 7;
    }

    // ---- Helper: table row ----
    function tableRow(name, qty, unitPrice, lineTotal, unit, shade){
      const rowH = 8;
      // check page overflow
      if(y + rowH > 272){
        doc.addPage();
        y = 16;
      }
      if(shade){
        doc.setFillColor(249, 249, 252);
        doc.rect(ML, y, CW, rowH, 'F');
      }
      doc.setTextColor(...INK);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);

      const col1 = ML + 3;
      const col2 = ML + CW * 0.58;
      const col3 = ML + CW * 0.70;
      const col4 = ML + CW * 0.84;
      const col5 = ML + CW;

      // Truncate long names
      const maxNameW = CW * 0.55;
      const nameStr = doc.splitTextToSize(name, maxNameW)[0];

      doc.text(nameStr, col1, y + 5.2);
      doc.text(String(qty), col2, y + 5.2, { align: 'center' });
      doc.text(unitPrice === 0 ? 'FOC' : fmtGBP(unitPrice), col3 + (col4-col3)/2, y + 5.2, { align: 'center' });
      doc.setFont('helvetica', 'bold');
      doc.text(fmtGBP(lineTotal), col5 - 2, y + 5.2, { align: 'right' });
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(...GREY_TEXT);
      doc.setFontSize(7);
      doc.text(unit, col4 + 2, y + 5.2);

      // bottom border
      doc.setDrawColor(230, 230, 235);
      doc.setLineWidth(0.2);
      doc.line(ML, y + rowH, ML + CW, y + rowH);

      y += rowH;
    }

    // ---- Table header row ----
    function tableHeader(){
      const rowH = 7;
      doc.setFillColor(...BLUE);
      doc.rect(ML, y, CW, rowH, 'F');
      doc.setTextColor(...WHITE);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7.5);

      const col1 = ML + 3;
      const col2 = ML + CW * 0.58;
      const col3 = ML + CW * 0.70;
      const col4 = ML + CW * 0.84;
      const col5 = ML + CW;

      doc.text('Product', col1, y + 4.8);
      doc.text('Qty', col2, y + 4.8, { align: 'center' });
      doc.text('Unit Price', col3 + (col4-col3)/2, y + 4.8, { align: 'center' });
      doc.text('Line Total', col5 - 2, y + 4.8, { align: 'right' });
      doc.text('Billing', col4 + 2, y + 4.8);
      y += rowH;
    }

    // ---- Draw line items ----
    tableHeader();

    if(recurringItems.length){
      sectionLabel('Recurring Monthly Charges', BLUE_LIGHT, BLUE);
      recurringItems.forEach((q, i) => tableRow(q.name, q.qty, q.price, q.price * q.qty, q.unit, i % 2 === 0));
    }

    if(onetimeItems.length){
      y += 3;
      sectionLabel('One-off & Hardware Charges', GREY_HDR, GREY_TEXT);
      onetimeItems.forEach((q, i) => tableRow(q.name, q.qty, q.price, q.price * q.qty, q.unit, i % 2 === 0));
    }

    if(setupFeeItems.length){
      y += 3;
      sectionLabel('Zest4 Setup Fees (£15.00 per licence)', AMBER_LITE, AMBER);
      setupFeeItems.forEach((q, i) => tableRow(`${q.name} — Zest4 Configuration`, q.qty, 15.00, 15 * q.qty, 'one-off', i % 2 === 0));
    }

    // ---- Totals box ----
    y += 6;
    if(y > 245){ doc.addPage(); y = 16; }

    const totalsX = ML + CW * 0.45;
    const totalsW = CW * 0.55;

    function totalsRow(label, value, bold, colorArr){
      if(y + 8 > 275){ doc.addPage(); y = 16; }
      doc.setFont('helvetica', bold ? 'bold' : 'normal');
      doc.setFontSize(bold ? 10 : 8.5);
      doc.setTextColor(...(colorArr || INK));
      doc.text(label, totalsX + 3, y + 5.5);
      doc.text(value, totalsX + totalsW - 2, y + 5.5, { align: 'right' });
      y += 8;
    }

    // thin divider
    doc.setDrawColor(200, 200, 210);
    doc.setLineWidth(0.3);
    doc.line(totalsX, y, totalsX + totalsW, y);
    y += 2;

    totalsRow('Recurring total (per month)', fmtGBP(recurringTotal));
    totalsRow('One-off & hardware charges', fmtGBP(hardwareTotal));
    if(setupFeeTotal > 0) totalsRow('Zest4 setup fees', fmtGBP(setupFeeTotal), false, AMBER);

    // grand total bar
    y += 1;
    doc.setFillColor(...BLUE);
    doc.rect(totalsX, y, totalsW, 10, 'F');
    doc.setTextColor(...WHITE);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10.5);
    doc.text('Total (first invoice)', totalsX + 3, y + 6.8);
    doc.text(fmtGBP(grandTotal), totalsX + totalsW - 2, y + 6.8, { align: 'right' });
    y += 14;

    // ---- Product descriptions ----
    const descItems = quoteItems.filter(q => getDescription(q) || q.hasSetupFee);
    if(descItems.length){
      if(y > 220){ doc.addPage(); y = 16; }

      y += 4;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.setTextColor(...BLUE);
      doc.text('Product Descriptions', ML, y);
      y += 6;

      descItems.forEach(q => {
        const desc = getDescription(q) + (q.hasSetupFee
          ? ' Note: Zest4 setup fee included — configuration details will be required before provisioning can begin.'
          : '');
        if(!desc.trim()) return;

        // name row
        if(y + 12 > 272){ doc.addPage(); y = 16; }
        doc.setFillColor(...BLUE_LIGHT);
        doc.rect(ML, y, CW, 6.5, 'F');
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8);
        doc.setTextColor(...BLUE);
        doc.text(q.name, ML + 3, y + 4.5);
        y += 6.5;

        // description text (wrapped)
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(7.5);
        doc.setTextColor(...INK);
        const lines = doc.splitTextToSize(desc, CW - 6);
        lines.forEach(line => {
          if(y + 5 > 272){ doc.addPage(); y = 16; }
          doc.text(line, ML + 3, y + 4);
          y += 5;
        });
        y += 3;
      });
    }

    // ---- Footer on every page ----
    const pageCount = doc.getNumberOfPages();
    for(let p = 1; p <= pageCount; p++){
      doc.setPage(p);
      doc.setFillColor(245, 245, 248);
      doc.rect(0, 285, PW, 12, 'F');
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7);
      doc.setTextColor(...GREY_TEXT);
      doc.text('Zest4 Ltd  |  0161 956 3300  |  cloudsales@zest4.com  |  All prices exc. VAT. Indicative only, subject to formal order confirmation.', ML, 291);
      doc.text(`Page ${p} of ${pageCount}`, PW - MR, 291, { align: 'right' });
    }

    doc.save(fileName);
  }

  function escapeAttr(s){
    return s.replace(/"/g, '&quot;');
  }

  // Exposed so the call-routing gate can start the calculator only after
  // it confirms the call came through the correct 8x8 ring group extension.
  window.startPricingCalculator = render;
})();
</script>

<script>
(function(){
  // ---------- 8x8 Call Router Gate ----------
  // Pops this page up only when an inbound call lands on the configured
  // ring group extension. If the extension doesn't match, the tab closes
  // itself and the pricing calculator never initialises.

  const urlParams = new URLSearchParams(window.location.search);
  const callee = urlParams.get('callee'); // Extension dialed
  const caller = urlParams.get('caller'); // Customer phone number
  const hasParams = window.location.search.length > 0;

  // TARGET EXTENSION TO FILTER FOR
  const targetExtension = "1061";

  const checkingStatus = document.getElementById("checking-status");
  const appEl = document.getElementById("app");

  function startCalculator() {
    checkingStatus.classList.add("call-gate-hidden");
    appEl.classList.remove("call-gate-hidden");
    if (typeof window.startPricingCalculator === "function") {
      window.startPricingCalculator();
    }
  }

  if (!hasParams) {
    // No URL parameters — direct access, skip the gate and open calculator.
    startCalculator();
  } else if (callee === targetExtension) {
    // MATCH: called via 8x8 screen pop on the correct ring group extension.
    startCalculator();
  } else {
    // URL params present but extension doesn't match — not our call, close silently.
    window.close();
  }
})();
</script>
